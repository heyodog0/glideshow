# Every push: the type and lint checks (about a minute; no build step, they read the plain JS and Python).
# Locally: tools/check.sh. The browser tests are tests.yml.
name: checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: tools/check.sh
